name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build all packages and Web UI
        run: pnpm build

      - name: Smoke test CLI against demo workspace
        run: |
          node packages/cli/dist/cli.js scan --demo --json > /dev/null
          node packages/cli/dist/cli.js budget --demo
          node packages/cli/dist/cli.js conflicts --demo
          node packages/cli/dist/cli.js route --demo "Deploy a Cloudflare Worker with Supabase auth"
